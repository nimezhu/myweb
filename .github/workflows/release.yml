# Pushing a tag vX.Y.Z publishes a GitHub release with the binaries that
# "myweb upgrade" installs.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: scripts/release-build.sh "$GITHUB_REF_NAME"
      # myweb upgrade installs only releases whose checksums.txt is signed
      # with a key built into myweb (selfupdate.Keys)
      - name: sign
        env:
          MYWEB_RELEASE_KEY: ${{ secrets.MYWEB_RELEASE_KEY }}
        run: go run ./cmd/myweb-publish sign -key env:MYWEB_RELEASE_KEY dist/release/checksums.txt
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          # the version's section of CHANGELOG.md, else GitHub's list of commits
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          notes="--notes-file notes.md"
          [ -s notes.md ] || notes=--generate-notes
          gh release create "$GITHUB_REF_NAME" dist/release/* $pre $notes \
            --verify-tag --title "myweb ${GITHUB_REF_NAME#v}"

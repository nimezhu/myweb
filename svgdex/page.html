<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>svgdex</title>
<style>
:root{--bg:#f7f7f8;--panel:#fff;--ink:#18181b;--muted:#6b6b76;--line:#e2e2e6;--accent:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#18181b;--panel:#222226;--ink:#ececf0;--muted:#a1a1aa;--line:#38383f;--accent:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0 8px 0 0;font-size:16px}
input,select{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:inherit;font:inherit}
#q{flex:1 1 220px;min-width:0}
#info{padding:10px 16px;color:var(--muted)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:0 16px 16px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;min-width:0}
.cell:hover{border-color:var(--accent)}
.cell .art{width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:6px}
.cell img{max-width:48px;max-height:48px}
.cell span{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell small{color:var(--muted);font-size:10.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#more[hidden]{display:none}
#more{display:block;margin:0 auto 24px;height:36px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:inherit;font:inherit;cursor:pointer}
#detail{position:fixed;right:16px;bottom:16px;width:min(360px,calc(100vw - 32px));padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 12px 36px rgba(0,0,0,.25)}
#detail[hidden]{display:none}
#detail .big{height:160px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;margin-bottom:10px}
#detail .big img{max-width:140px;max-height:140px}
#detail dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:12.5px}
#detail dt{color:var(--muted)}#detail dd{margin:0;word-break:break-word}
#detail button{float:right;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>svgdex</h1>
  <input id="q" type="search" placeholder="Search icons…" autocomplete="off" list="sug" autofocus>
  <datalist id="sug"></datalist>
  <select id="set"><option value="">All sets</option></select>
  <select id="style"><option value="">Any style</option><option value="mono">One colour</option><option value="color">Colour</option></select>
</header>
<div id="info"></div>
<div id="grid"></div>
<button id="more" hidden>More</button>
<aside id="detail" hidden></aside>
<script>
const $ = s => document.querySelector(s)
const esc = s => String(s ?? '').replace(/[<&>"]/g, c => ({ '<': '&lt;', '&': '&amp;', '>': '&gt;', '"': '&quot;' }[c]))
let next = 0, seq = 0
async function search(append = false) {
  const my = ++seq
  const p = new URLSearchParams({ q: $('#q').value, limit: 120, offset: append ? next : 0, facets: append ? '0' : '1' })
  if ($('#set').value) p.set('set', $('#set').value)
  if ($('#style').value) p.set('style', $('#style').value)
  const r = await (await fetch('search?' + p)).json()
  if (my !== seq) return
  if (!append) $('#grid').replaceChildren()
  for (const it of r.items) {
    const c = document.createElement('div'); c.className = 'cell'; c.title = it.name
    c.innerHTML = `<div class="art"><img loading="lazy" src="${esc(it.url)}" alt=""></div><span>${esc(it.name)}</span><small>${esc(it.set)}</small>`
    c.onclick = () => show(it)
    $('#grid').appendChild(c)
  }
  next = r.next || 0
  $('#more').hidden = !next
  if (!append) $('#info').textContent = `${r.total.toLocaleString()} icon${r.total === 1 ? '' : 's'}` + (r.facets ? ' · ' + Object.entries(r.facets.license || {}).map(([k, n]) => `${k || 'no licence'} ${n}`).join(' · ') : '')
}
function show(it) {
  const d = $('#detail'); d.hidden = false
  d.innerHTML = `<button aria-label="Close">×</button><div class="big"><img src="${esc(it.url)}" alt=""></div>
    <dl><dt>Name</dt><dd>${esc(it.name)}</dd><dt>Set</dt><dd>${esc(it.set)}</dd><dt>Licence</dt><dd>${esc(it.license || '—')}</dd>
    ${it.author ? `<dt>Author</dt><dd>${esc(it.author)}</dd>` : ''}<dt>Size</dt><dd>${it.w}×${it.h} · ${(it.bytes / 1024).toFixed(1)} KB · ${it.mono ? 'one colour' : it.colors + ' colours'}</dd>
    <dt>Tags</dt><dd>${esc((it.tags || []).join(', '))}</dd><dt>File</dt><dd><a href="${esc(it.url)}" target="_blank">${esc(it.key)}</a></dd></dl>`
  d.querySelector('button').onclick = () => { d.hidden = true }
}
let t = null
$('#q').addEventListener('input', () => {
  clearTimeout(t); t = setTimeout(() => search(), 180)
  const q = $('#q').value
  if (q.trim()) fetch('suggest?' + new URLSearchParams({ q })).then(r => r.json()).then(list => { $('#sug').innerHTML = list.map(w => `<option value="${esc(q.replace(/\S*$/, w))}">`).join('') })
})
$('#set').onchange = $('#style').onchange = () => search()
$('#more').onclick = () => search(true)
fetch('sets').then(r => r.json()).then(sets => { for (const s of sets) $('#set').insertAdjacentHTML('beforeend', `<option value="${esc(s.id)}">${esc(s.name)} (${s.count})</option>`) })
search()
</script>
</body>
</html>
